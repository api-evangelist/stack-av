aid: stack-av
name: Stack AV
description: >-
  Stack AV is a Pittsburgh, Pennsylvania autonomous-vehicle company founded in 2023 by Bryan Salesky
  (CEO), Peter Rander (President) and Brett Browning (CTO) — the leadership team behind Argo AI — and
  backed by SoftBank Group. The company develops AI-driven autonomy software and hardware for Class 8
  commercial freight trucking, targeting driver shortages, vehicle uptime, safety, operating cost and
  emissions, and in May 2026 unveiled its first autonomous truck built in collaboration with PACCAR
  and Peterbilt Motors. Stack AV runs a public open-source engineering organization at
  github.com/stackav-oss (dltype, conch Triton kernels, clockwork, scene-tokens, push-guard, ai-workloads).
  It publishes no public developer program, API reference, or machine-readable API contract as of
  August 2026 — the product is an autonomous freight service, not a developer platform.
